[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hltb"
version = "0.1.0"
description = "HowLongToBeat gameplay duration analysis helpers"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
